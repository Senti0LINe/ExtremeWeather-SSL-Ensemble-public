[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "extremeweather-ssl-ensemble"
version = "2.0.0"
description = "Convection-initiation detection and object-level warning from Himawari-8 infrared sequences"
readme = "README.md"
authors = [
    { name = "Liang Haoyu" }
]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
keywords = [
    "meteorology",
    "satellite",
    "convective-initiation",
    "object-localization",
    "deep-learning",
    "ensemble-learning",
    "nowcasting",
    "uncertainty-quantification"
]
# Verified against the actual imports in ewci/ and tools/ (2026-11-13).
# netCDF4 is the engine xarray needs to read the ERA5 .nc files.
dependencies = [
    "torch>=2.1.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "lightgbm>=4.0.0",
    "joblib>=1.3.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "pillow>=10.0.0",
    "zarr>=2.16.0",
    "xarray>=2023.0.0",
    "netCDF4>=1.6.0"
]

[project.optional-dependencies]
era5 = [
    "cdsapi>=0.6.0"
]
dev = [
    "pytest>=7.4.0",
    "black>=23.7.0",
    "flake8>=6.1.0",
    "isort>=5.12.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ewci*"]

